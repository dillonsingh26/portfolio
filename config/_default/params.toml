env = 'production'
description = 'Dillon Singh — data science and business analytics. Founder of StatusTix. M.S. in Data Science (Artificial Intelligence specialization), Northwestern University, December 2026.'
author = 'Dillon Singh'
mainSections = ['blog']

defaultTheme = 'auto'
ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowShareButtons = false
ShowToc = false

[assets]
  favicon = 'favicon.svg'

[label]
  text = 'Dillon Singh'

[profileMode]
  enabled = true
  title = 'Dillon Singh'
  subtitle = 'Data science and business analytics · Founder of StatusTix · M.S. in Data Science (AI specialization), Northwestern — December 2026 · New York, NY'
  imageUrl = 'images/monogram.svg'
  imageTitle = 'Dillon Singh'
  imageWidth = 128
  imageHeight = 128

  [[profileMode.buttons]]
    name = 'Projects'
    url = 'projects/'

  [[profileMode.buttons]]
    name = 'Experience'
    url = 'experience/'

  [[profileMode.buttons]]
    name = 'Resume'
    url = 'resume/'

[[socialIcons]]
  name = 'github'
  url = 'https://github.com/dillonsingh26'

[[socialIcons]]
  name = 'email'
  url = 'mailto:dillonsingh26.26@gmail.com'

[[socialIcons]]
  name = 'rss'
  url = 'index.xml'

# Search tuning for the theme's Fuse.js search page
[fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ['title', 'permalink', 'summary', 'content']
