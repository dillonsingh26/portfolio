  [services.disqus]
    shortname = ""
  [services.googleAnalytics]
    id = ""

[pagination]
  pagerSize = 5 # frontpage pagination

[outputs]
home = ["HTML", "RSS", "Algolia"]

[params]
  header_image = "img/home-bg-brooklyn-bridge.jpg"
  SEOTitle = "Dillon Singh | Data Science & Analytics"
  description = "Dillon Singh — M.S. in Data Science (Artificial Intelligence specialization), Northwestern University. Data science and business analytics."
  keyword = "Dillon Singh, data science, business analytics, artificial intelligence, Northwestern University, StatusTix"
  slogan = "M.S. in Data Science · Northwestern University"
  upstreamAttribution = true

  image_404 = "img/404-bg.jpg"
  title_404 = "Page not found"
  omit_categories = false

  # leancloud storage for page view counter
  page_view_counter = false
  leancloud_app_id = ""
  leancloud_app_key = ""

  # algolia site search
  algolia_search = false
  algolia_appId = ""
  algolia_indexName = ""
